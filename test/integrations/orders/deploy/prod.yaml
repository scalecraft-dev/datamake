# Deploy topology for the `prod` profile. Tracked, secret-free.
target: kubernetes

# Open endpoint (cell is shareable with no roles): this is the deliberate,
# reviewed acknowledgement the open-endpoint pre-flight (§8f) requires.
allow_anonymous: true

# Target-specific topology (Kubernetes schema -> ADR 0002). `serve:` and
# `schedule:` are each presence-based (issue #8): a Server deploys iff `serve:`
# is present, a Builder CronJob iff `schedule:` is. At least one is required.
serve:
  replicas: 1
# namespace: data
# schedule: "0 * * * *"
