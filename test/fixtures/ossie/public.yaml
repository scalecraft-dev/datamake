version: 0.1.1
semantic_model:
  - name: public
    description: Customer-facing reference data.
    datasets:
      - name: customer
        source: '"dw-main-silver".public.customer'
        primary_key: [customer_id]
        description: One row per customer.
        ai_context:
          synonyms: [customers, accounts]
        fields:
          - name: customer_id
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: customer_id
          - name: region
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: region
            dimension:
              is_time: false
